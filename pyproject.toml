[project]
name = "jobai"
version = "0.1.0"
description = "Personal job-application automation (single user)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6",
]

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.1"]  # optional, off by default; scraping ToS risk

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["jobspy", "jobspy.*"]
ignore_missing_imports = true
